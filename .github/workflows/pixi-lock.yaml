# TEMPORARY: regenerates pixi.lock on linux (cross-locking is impossible from macOS).
# Runs on push to this branch; download the pixi-lock artifact, commit it, then delete this file.
name: Regenerate pixi lock
on:
  push:
    branches: [keras-hgq2]
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.50.2
          run-install: false

      - name: Regenerate lock file
        run: pixi lock

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: pixi-lock
          path: pixi.lock
