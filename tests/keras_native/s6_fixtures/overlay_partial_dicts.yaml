# Overlay on base.yaml + linformer.yaml that tells LightningCLI's merge from a key-by-key dict merge
# (test_config.py::test_overlays_merge_as_lightningcli). Init args are given as plain dicts (no class_path, no
# init_args) at classes base.yaml gave, as eval.yaml does; attn_kwargs and decoder_layer_config are dict-typed, so
# LightningCLI replaces them whole.
model:
  model:
    encoder:
      attn_type: torch
      attn_kwargs:
        num_heads: 8
    decoder:
      num_decoder_layers: 2
      decoder_layer_config:
        dim: 256
        attn_kwargs:
          num_heads: 8
data:
  num_val: 10
