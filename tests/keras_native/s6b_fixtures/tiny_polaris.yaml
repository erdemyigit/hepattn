# Generated by make_tiny_config.py (do not edit): the Polaris config at S6b test sizes.
name: s6b_tiny
seed_everything: 42
data:
  inputs:
    hit:
    - x
    - y
    - z
    - r
    - s
    - theta
    - phi
  targets:
    particle:
    - e
    - pt
    - eta
    - sinphi
    - cosphi
  num_objects: 16
  train_path: /nonexistent/clic/train_clic_fix.root
  valid_path: /nonexistent/clic/val_clic_fix.root
  test_path: /nonexistent/clic/val_clic_fix.root
  num_workers: 0
  num_train: 32
  num_test: 10
  num_val: 10
  batch_size: 4
  incidence_cutval: 0.01
  scale_dict_path: src/hepattn/experiments/clic/configs/clic_var_transform.yaml
  max_nodes: 64
trainer:
  max_epochs: 3
  accelerator: cpu
  devices: 1
  precision: '32'
  gradient_clip_val: 0.1
  log_every_n_steps: 1
  default_root_dir: logs
  enable_progress_bar: true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: hepattn-clic
      online: false
  callbacks:
  - class_path: hepattn.callbacks.InferenceTimer
  - class_path: hepattn.callbacks.SaveConfig
  - class_path: hepattn.callbacks.Checkpoint
    init_args:
      monitor: val/loss
      save_last: true
  - class_path: hepattn.experiments.clic.PflowPredictionWriter
  - class_path: lightning.pytorch.callbacks.ModelSummary
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 50
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: /nonexistent/ckpts
      every_n_train_steps: 1000
      save_last: true
      save_top_k: 1
      monitor: null
  - class_path: hepattn.keras.callbacks.BetaPID
    init_args:
      target_ebops: 80000000.0
      init_beta: 1.0e-09
      i: 0.5
      warmup_epochs: 1
      max_beta: 1.0e-06
      min_beta: 1.0e-12
  - class_path: hepattn.keras.callbacks.EBOPsMonitor
  - class_path: hepattn.keras.callbacks.BitwidthMonitor
  - class_path: hepattn.keras.callbacks.MetricsCsvWriter
    init_args:
      path: /nonexistent/ckpts/metrics.csv
  - class_path: hepattn.keras.callbacks.PeriodicEBOPs
    init_args:
      every_n_steps: 2
  accumulate_grad_batches: 2
  gradient_clip_algorithm: norm
model:
  optimizer: AdamW
  lrs_config:
    initial: 0.0002
    max: 0.002
    end: 2.0e-05
    pct_start: 0.3
    weight_decay: 1e-4
    skip_scheduler: false
  mtl: false
  model:
    class_path: hepattn.keras.maskformer.KerasMaskFormer
    init_args:
      dim: 16
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: node
              fields:
              - features
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 27
                  output_size: 16
                  activation: SwiGLU
              posenc:
                class_path: hepattn.models.posenc.FourierPositionEncoder
                init_args:
                  input_name: node
                  dim: 16
                  fields:
                  - eta
                  - phi
                  scale: 0.1
      encoder:
        num_layers: 1
        attn_type: linformer
        norm: FastLayerNorm
        hybrid_norm: true
        dense_norm_placement: legacy
        value_residual: true
        num_register_tokens: 8
        attn_kwargs:
          num_heads: 2
          linformer_seq_len: 72
          linformer_k: 8
        dense_kwargs:
          activation: SwiGLU
      decoder:
        num_decoder_layers: 1
        num_queries: 16
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: 16
          norm: FastLayerNorm
          hybrid_norm: true
          dense_norm_placement: legacy
          query_update_order: ca_sa_dense
          self_attn_norm_kv: true
          attn_kwargs:
            num_heads: 2
            attn_type: linformer
            linformer_seq_len: 64
            linformer_k: 8
          dense_kwargs:
            activation: SwiGLU
      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.ObjectClassificationTask
            init_args:
              name: classification
              input_object: query
              output_object: pflow
              target_object: particle
              num_classes: 5
              losses:
                object_ce: 2
              costs:
                object_ce: 2
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  activation: torch.nn.SiLU
                  output_size: 6
                  hidden_layers:
                  - 16
              null_weight: 0.5
              class_weights:
              - 1.0
              - 3.0
              - 8.0
              - 1.5
              - 1.0
              mask_queries: false
              has_intermediate_loss: true
              has_first_layer_loss: true
          - class_path: hepattn.models.task.ObjectHitMaskTask
            init_args:
              name: mask
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              pred_threshold: 0.1
              logit_scale: 4
              losses:
                mask_bce: 5.0
                mask_dice: 1.0
              costs:
                mask_dice: 1.0
              dim: 16
              object_net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  activation: SwiGLU
              constituent_net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  activation: SwiGLU
              null_weight: 1.0
              has_intermediate_loss: true
          - class_path: hepattn.models.task.IncidenceRegressionTask
            init_args:
              name: incidence
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              losses:
                kl_div: 1.0
              costs:
                kl_div: 1.0
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  activation: torch.nn.SiLU
                  hidden_layers:
                  - 16
              node_net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  activation: SwiGLU
                  hidden_layers:
                  - 16
              has_intermediate_loss: false
          - class_path: hepattn.models.task.IncidenceBasedRegressionTask
            init_args:
              name: regression
              fields:
              - e
              - pt
              - eta
              - sinphi
              - cosphi
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              loss: l1
              loss_weight: 10.0
              cost_weight: 10.0
              use_incidence: true
              use_nodes: true
              cost: new
              mode: scale
              scale_dict_path: src/hepattn/experiments/clic/configs/clic_var_transform.yaml
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 38
                  activation: torch.nn.SiLU
                  output_size: 5
                  hidden_layers:
                  - 16
              has_intermediate_loss: false
      input_sort_field: phi
      quant:
        weight:
          default_q_type: kbi
          b0: 8
          i0: 2
        datalane:
          default_q_type: kif
          i0: 4
          f0: 8
        table:
          default_q_type: kif
          i0: 2
          f0: 10
        ebops:
          beta0: 0.0
